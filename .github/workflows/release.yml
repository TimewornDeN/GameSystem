name: Release

# A release is made when a tag like v1.0.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test GameSystem.slnx -c Release
      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
